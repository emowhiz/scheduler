services:
  scheduler_postgres_container:
    image: postgres:18-alpine
    container_name: scheduler_postgres_container
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql
    networks:
      - custom_bridge_network
  app:
    build: .
    container_name: scheduler-service
    ports:
      - "8080:8080"
    depends_on:
      - scheduler_postgres_container
    environment:
      DB_HOST: scheduler_postgres_container
      DB_PORT: 5432
      DB_NAME: scheduler_db
      DB_USERNAME: scheduler
      DB_PASSWORD: scheduler
    networks:
      - custom_bridge_network
volumes:
  postgres-data-dev:

networks:
  custom_bridge_network:
    name: "custom_bridge_network"
    driver: bridge